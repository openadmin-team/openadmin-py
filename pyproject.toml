[project]
name = "openadmin"
version = "0.7.19"
description = "Add your description here"
authors = [
  { name="Mykyta Kasianenko", email="mykytakasianenko@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "itsdangerous>=2.2.0",
    "typing_extensions>=4.12.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/openadmin-team/openadmin-py"
Issues = "https://github.com/openadmin-team/openadmin-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["client"]
artifacts = ["openadmin/__client__/**"]

[tool.hatch.build.targets.wheel]
packages = ["openadmin"]
artifacts = ["openadmin/__client__/**"]

[tool.codespell]
ignore-words-list = "astroid,dependant"
skip = "*/node_modules/*,*/dist/*,*.lock,*/.git/*,*/DESIGN.md,**/__client__/**"

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["."]
exclude = ["**/__pycache__", ".venv", ".ruff_cache", "**/.*", "**/node_modules", "**/dist", "**/build", "**/.eggs", "**/.git", "**/.tox"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E", "F", "I"]
ignore = ["E501", "B008", "BLE001", "SIM102", "PLR0133"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bandit[toml]>=1.9.4",
    "codespell>=2.4.3",
    "faker>=40.21.0",
    "greenlet>=3.5.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "reuse[charset-normalizer]>=6.2.0",
    "ruff>=0.16.0",
    "sqlalchemy>=2.0.50",
    "vulture>=2.16",
]
