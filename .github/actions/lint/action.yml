name: "🧹 Lint"
description: "Run ruff linter"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    - uses: oven-sh/setup-bun@v2
    - shell: bash
      run: cd client && bun install --frozen-lockfile
    - shell: bash
      run: make check/lint
